name: Release prebuilt extension

on:
  pull_request:
  push:
    branches: [main, claude/ci-release-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm build

      # package.json is the source of truth for the version; WXT copies it into
      # the generated manifest, so the built manifest is read back here.
      - name: Read extension version
        id: version
        run: |
          version=$(node -p "require('./.output/chrome-mv3/manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Zip the *contents* of the build dir so manifest.json sits at the zip
      # root, which is what Chrome load-unpacked and the Web Store expect.
      - name: Zip build output
        run: |
          cd .output/chrome-mv3
          zip -r "$GITHUB_WORKSPACE/webmcp-inspector.zip" .
          cd "$GITHUB_WORKSPACE"
          unzip -l webmcp-inspector.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webmcp-inspector-zip
          path: webmcp-inspector.zip
          if-no-files-found: error

    outputs:
      tag: ${{ steps.version.outputs.tag }}

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/ci-release-test')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webmcp-inspector-zip

      - name: Resolve tag (scratch branch uses a throwaway prerelease tag)
        id: tag
        run: |
          if [ "$GITHUB_REF" = "refs/heads/claude/ci-release-test" ]; then
            echo "tag=v0.1.0-ci-test" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.existing.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: webmcp-inspector.zip
          prerelease: ${{ steps.tag.outputs.prerelease }}

      # A merge to main without a version bump must not fail the run. When the
      # release already exists we UPDATE its asset in place (--clobber) rather
      # than skipping, so releases/latest/download/webmcp-inspector.zip always
      # serves a build of the current main.
      - name: Update existing release asset
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" webmcp-inspector.zip --clobber

      - name: Verify the published release and its asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          gh release view "$TAG"
          echo "--- assets via api ---"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '.prerelease, (.assets[] | "\(.name) \(.size) bytes updated=\(.updated_at)")'
          rm -rf /tmp/dl && mkdir -p /tmp/dl
          gh release download "$TAG" -D /tmp/dl --clobber
          ls -l /tmp/dl
          SIZE=$(stat -c%s /tmp/dl/webmcp-inspector.zip)
          echo "downloaded asset size: $SIZE"
          test "$SIZE" -gt 100000
          echo "--- contents of the PUBLISHED zip ---"
          unzip -l /tmp/dl/webmcp-inspector.zip
          unzip -Z1 /tmp/dl/webmcp-inspector.zip | grep -qx 'manifest.json'
          echo "manifest.json IS at the zip root"
          unzip -p /tmp/dl/webmcp-inspector.zip manifest.json

      # Scratch-branch safety net: if anything above failed, do not strand a
      # test release/tag in the repo.
      - name: Clean up test release on failure
        if: failure() && github.ref == 'refs/heads/claude/ci-release-test'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "${{ steps.tag.outputs.tag }}" --cleanup-tag --yes || true
